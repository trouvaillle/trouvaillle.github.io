<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a24a"/>
      <stop offset="1" stop-color="#e8c56d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="626" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.3"/>
  
  <g transform="translate(600, 315)" text-anchor="middle">
    <text x="0" y="-40" font-family="Georgia, 'Noto Serif KR', serif" font-weight="700" font-size="72" fill="url(#accent)" filter="url(#glow)">온조 만세력</text>
    <text x="0" y="30" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-weight="400" font-size="28" fill="#c9c4b8" letter-spacing="2">사주 · 절기 · 음양력 · 대운 · 세운 · 신살</text>
    <text x="0" y="80" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-weight="300" font-size="20" fill="#8a8578">생년월일시로 사주팔자, 대운, 세운, 신살, 지장간을 계산합니다.</text>
  </g>
  
  <circle cx="600" cy="520" r="36" fill="url(#accent)" opacity="0.15"/>
  <circle cx="600" cy="520" r="28" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5"/>
  <text x="600" y="530" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="36" fill="url(#accent)">巳</text>
</svg>